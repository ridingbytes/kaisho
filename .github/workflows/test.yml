name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: flake8 kaisho/ --max-line-length=80 --count --statistics --exclude=__pycache__

      - name: Run tests
        run: pytest --tb=short -q

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20. jsdom 30 (via vitest) declares
          # engines ^22.22.2 || ^24.15.0 || >=26.0.0, and on
          # 20 it fails at import with
          # "webidl.util.markAsUncloneable is not a
          # function" rather than anything that names a Node
          # version. The runners also warn that 20 is
          # deprecated and force actions onto 24.
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: cd frontend && pnpm install

      - name: Type check and build
        run: cd frontend && pnpm build

      - name: Run tests
        run: cd frontend && pnpm test
