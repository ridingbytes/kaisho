[package]
name = "kaisho-desktop"
version = "2.2.1"
description = "Kaisho Desktop App"
authors = ["Riding Bytes"]
license = "MIT"
repository = "https://github.com/ridingbytes/kaisho"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
shlex = "1"
# Pill-style tray icon renderer. ab_glyph rasterizes the
# bundled font; image generates the final PNG that Tauri
# sets as the tray icon.
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
# Embed Info.plist directly into the binary so macOS
# recognises the bundle identifier for the bare dev
# binary (no .app wrapper). Without this, Sequoia
# silently refuses to register NSStatusItem for
# unbundled processes -- the tray icon never appears
# in `tauri dev` even though the code runs fine.
[target.'cfg(target_os = "macos")'.dependencies]
embed_plist = "1.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
